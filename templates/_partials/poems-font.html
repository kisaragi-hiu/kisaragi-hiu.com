{{ if eq (.Page.Param "language") "ja" }}
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Zen Kaku Gothic New", sans-serif;
    }
  </style>
{{ else }}
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Zen+Kaku+Gothic+New&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: "Zen Kaku Gothic New", "Noto Sans TC", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
    }
  </style>
{{ end }}
